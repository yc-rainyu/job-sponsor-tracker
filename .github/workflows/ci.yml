name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# jobs only read the code, so the token cannot push or edit the repo;
# publish alone also gets packages: write for GHCR
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jst
          POSTGRES_PASSWORD: jst
          POSTGRES_DB: jst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jst -d jst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jst:jst@localhost:5432/jst
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create test database
        run: |
          uv run python -c "
          import psycopg
          conn = psycopg.connect(host='localhost', user='jst', password='jst', dbname='jst', autocommit=True)
          conn.execute('CREATE DATABASE jst_test')
          "

      - name: Migrate
        run: |
          uv run alembic upgrade head
          DATABASE_URL="${DATABASE_URL%/*}/jst_test" uv run alembic upgrade head

      - name: Ruff
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm exec prettier --check "**/*.{ts,tsx}"

      - name: Build
        run: pnpm build

  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f api/Dockerfile -t jst-api .

      # no database here, so skip the entrypoint and just load the app and the data
      - name: Smoke test
        run: >-
          docker run --rm --entrypoint python
          -e DATABASE_URL=postgresql+psycopg://ci:ci@localhost/ci
          jst-api -c "import app.main; from app.services.jd_rules import analyse; analyse('Python')"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose.yaml reads .env, and a fresh checkout has none
      - name: Write .env
        run: |
          {
            echo POSTGRES_USER=jst
            echo POSTGRES_PASSWORD=jst
            echo POSTGRES_DB=jst
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Start db and api
        run: docker compose up -d --build --wait

      # the api has no healthcheck, and it runs migrations before it listens
      - name: Wait for the api
        run: curl -sf --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8000/health

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Playwright
        working-directory: web
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Api logs
        if: failure()
        run: docker compose logs api

  publish:
    if: github.event_name == 'push'
    needs: [api, web, image, e2e]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/job-sponsor-tracker-api
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tag=$GITHUB_SHA
          else
            tag=dev-$GITHUB_SHA
          fi
          docker build -f api/Dockerfile -t "$IMAGE:$tag" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .
          docker push "$IMAGE:$tag"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag "$IMAGE:$tag" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  verify-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the live api to run this commit
        run: |
          for _ in $(seq 60); do
            live=$(curl -fsS https://tracker-api.ycrainyu.com/health | jq -r .commit || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "live on $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "the live api is still on ${live:-unknown}, expected $GITHUB_SHA" >&2
          exit 1
